<h2 class="h5 mb-3">Configuración</h2>

@if (error(); as mensaje) {
  <div class="alert alert-danger" role="alert">{{ mensaje }}</div>
} @else if (cargando()) {
  <p class="text-body-secondary">Cargando…</p>
} @else {
  <form class="card" style="max-width: 480px" (ngSubmit)="guardar()">
    <div class="card-body">
      @if (exito(); as mensaje) {
        <div class="alert alert-success py-2" role="status">{{ mensaje }}</div>
      }
      @if (errorFormulario(); as mensaje) {
        <div class="alert alert-danger py-2" role="alert">{{ mensaje }}</div>
      }

      <div class="mb-4">
        <label for="max-pedidos" class="form-label">Máximo de pedidos activos por repartidor</label>
        <input
          id="max-pedidos"
          name="max_pedidos_activos"
          type="number"
          class="form-control"
          min="1"
          max="20"
          step="1"
          aria-describedby="max-pedidos-ayuda"
          [class.is-invalid]="errores()['max_pedidos_activos']"
          [(ngModel)]="formulario.max_pedidos_activos"
        />
        <app-error-campo [mensajes]="errores()['max_pedidos_activos']" />
        <div id="max-pedidos-ayuda" class="form-text">Número entero entre 1 y 20.</div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="guardando()">
        {{ guardando() ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
}
