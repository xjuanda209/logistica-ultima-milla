<app-tarjeta titulo="Tipos de incidencia">
  <button acciones type="button" class="btn btn-primary" (click)="abrirFormulario()">
    + Nuevo tipo
  </button>

  <app-tabla
    titulo="Tipos de incidencia"
    [columnas]="columnas"
    [cargando]="cargando()"
    [error]="error()"
    [vacia]="datos().length === 0"
    textoVacio="Todavía no hay tipos de incidencia."
    detalleVacio="Crea el primero con «+ Nuevo tipo»."
    iconoVacio="bi-tags"
    [meta]="meta()"
    (cambiarPagina)="cargar($event)"
    (reintentar)="cargar(1)"
  >
    @for (tipo of datos(); track tipo.id) {
      <tr>
        <td>{{ tipo.nombre }}</td>
        <td>
          <div class="form-check form-switch mb-0">
            <input
              class="form-check-input"
              type="checkbox"
              role="switch"
              [id]="'tipo-activo-' + tipo.id"
              [checked]="tipo.activo"
              [disabled]="cambiandoEstado() === tipo.id"
              #interruptor
              (change)="cambiarEstado(tipo, interruptor)"
            />
            <label
              class="form-check-label small text-body-secondary"
              [for]="'tipo-activo-' + tipo.id"
            >
              {{ tipo.activo ? 'Activo' : 'Inactivo' }}
              <span class="visually-hidden">: {{ tipo.nombre }}</span>
            </label>
          </div>
        </td>
        <td class="text-end">
          <button
            type="button"
            class="btn btn-outline-secondary btn-sm"
            (click)="abrirFormulario(tipo)"
          >
            Editar
          </button>
        </td>
      </tr>
    }
  </app-tabla>
</app-tarjeta>

@if (modalAbierto()) {
  <app-modal
    [titulo]="editando() ? 'Editar tipo de incidencia' : 'Nuevo tipo de incidencia'"
    (cerrar)="cerrarFormulario()"
  >
    <form (ngSubmit)="guardar()">
      @if (errorFormulario(); as mensaje) {
        <div class="alert alert-danger" role="alert">{{ mensaje }}</div>
      }

      <app-campo
        etiqueta="Nombre"
        para="tipo-nombre"
        [obligatorio]="true"
        [errores]="errores()['nombre']"
      >
        <input
          id="tipo-nombre"
          name="nombre"
          type="text"
          class="form-control"
          maxlength="60"
          required
          [class.is-invalid]="errores()['nombre']"
          [(ngModel)]="formulario.nombre"
        />
      </app-campo>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn btn-outline-secondary" (click)="cerrarFormulario()">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="guardando()">
          {{ guardando() ? 'Guardando…' : 'Guardar' }}
        </button>
      </div>
    </form>
  </app-modal>
}
