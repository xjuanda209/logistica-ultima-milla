<main class="min-vh-100 d-flex align-items-center justify-content-center bg-body-tertiary p-3">
  <div class="card shadow-sm w-100" style="max-width: 400px">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Logística de Última Milla</h1>
      <p class="text-body-secondary mb-4">Inicia sesión para continuar</p>

      @if (error(); as mensaje) {
        <div class="alert alert-danger py-2" role="alert">{{ mensaje }}</div>
      }

      <form #formulario="ngForm" (ngSubmit)="entrar()">
        <div class="mb-3">
          <label for="correo" class="form-label">Correo</label>
          <input
            id="correo"
            name="correo"
            type="email"
            class="form-control"
            autocomplete="username"
            required
            email
            [(ngModel)]="correo"
          />
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            class="form-control"
            autocomplete="current-password"
            required
            [(ngModel)]="password"
          />
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="formulario.invalid || enviando()"
        >
          {{ enviando() ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>
    </div>
  </div>
</main>
