<main class="acceso">
  <div class="card acceso__tarjeta">
    <div class="card-body p-4 p-sm-5">
      <app-logo class="acceso__logo d-block" />
      <p class="text-body-secondary mb-4">Plataforma de logística de última milla</p>

      <h1 class="fs-4 mb-3">Iniciar sesión</h1>

      @if (sesionVencida()) {
        <div class="alert alert-warning" role="status">
          Tu sesión venció. Inicia sesión de nuevo.
        </div>
      }

      <form (ngSubmit)="entrar()">
        <app-campo
          class="mb-3"
          etiqueta="Correo electrónico"
          para="correo"
          [errores]="errores()['correo']"
        >
          <input
            id="correo"
            name="correo"
            type="email"
            class="form-control"
            autocomplete="username"
            required
            [class.is-invalid]="errores()['correo']"
            [(ngModel)]="correo"
          />
        </app-campo>

        <app-campo
          class="mb-3"
          etiqueta="Contraseña"
          para="password"
          [errores]="errores()['password']"
        >
          <div class="position-relative">
            <input
              id="password"
              name="password"
              class="form-control pe-5"
              autocomplete="current-password"
              required
              [type]="mostrarPassword() ? 'text' : 'password'"
              [class.is-invalid]="errores()['password'] || error()"
              [(ngModel)]="password"
            />
            <button
              type="button"
              class="btn btn-link btn-sm text-body-secondary text-decoration-none fw-normal acceso__mostrar"
              [attr.aria-pressed]="mostrarPassword()"
              (click)="mostrarPassword.set(!mostrarPassword())"
            >
              {{ mostrarPassword() ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
        </app-campo>

        @if (error(); as mensaje) {
          <div class="alert alert-danger" role="alert">{{ mensaje }}</div>
        }

        <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="enviando()">
          {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
        </button>
      </form>

      <p class="text-body-secondary text-center mt-4 mb-0">
        ¿Olvidaste tu contraseña? Pide al administrador que la restablezca.
      </p>
    </div>
  </div>
</main>
