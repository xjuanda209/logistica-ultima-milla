<app-tarjeta>
  <app-tabla
    titulo="Clientes"
    [columnas]="['Nombre', 'Cédula', 'Teléfono', 'Dirección', 'Zona', 'Comercio']"
    [cargando]="cargando()"
    [error]="error()"
    [vacia]="clientes().length === 0"
    textoVacio="No hay clientes para mostrar."
    iconoVacio="bi-people"
    [meta]="meta()"
    (cambiarPagina)="cargar($event)"
    (reintentar)="cargar(1)"
  >
    @for (cliente of clientes(); track cliente.id) {
      <tr>
        <td class="fw-semibold">{{ cliente.nombre }}</td>
        <td>{{ cliente.cedula }}</td>
        <td>{{ cliente.telefono }}</td>
        <td>{{ cliente.direccion }}, {{ cliente.barrio }}</td>
        <td>{{ cliente.zona?.nombre }}</td>
        <td>{{ cliente.comercio?.nombre }}</td>
      </tr>
    }
  </app-tabla>
</app-tarjeta>
