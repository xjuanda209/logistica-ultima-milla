<app-tarjeta>
  <app-tabla
    titulo="Incidencias"
    [columnas]="['Pedido', 'Tipo', 'Descripción', 'Reportó', 'Fecha', 'Prioridad', 'Estado']"
    [cargando]="cargando()"
    [error]="error()"
    [vacia]="incidencias().length === 0"
    textoVacio="No hay incidencias para mostrar."
    iconoVacio="bi-exclamation-triangle"
    [meta]="meta()"
    (cambiarPagina)="cargar($event)"
    (reintentar)="cargar(1)"
  >
    @for (incidencia of incidencias(); track incidencia.id) {
      <tr>
        <td>
          @if (incidencia.pedido; as pedido) {
            <a [routerLink]="['/pedidos', pedido.id]">{{ pedido.numero }}</a>
          }
        </td>
        <td>{{ incidencia.tipo?.nombre }}</td>
        <td>{{ incidencia.descripcion }}</td>
        <td>{{ incidencia.usuario?.nombre }}</td>
        <td class="text-nowrap">{{ incidencia.created_at | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td><app-badge-estado tipo="prioridad" [valor]="incidencia.prioridad" /></td>
        <td><app-badge-estado tipo="incidencia" [valor]="incidencia.estado" /></td>
      </tr>
    }
  </app-tabla>
</app-tarjeta>
