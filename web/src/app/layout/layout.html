<aside class="lateral" [class.lateral--abierto]="menuMovil()" aria-label="Menú principal">
  <a class="lateral__marca" routerLink="/" (click)="menuMovil.set(false)">
    <app-logo [claro]="true" />
  </a>

  <nav class="lateral__nav">
    @for (opcion of opciones(); track opcion.ruta) {
      <a
        class="lateral__enlace"
        [routerLink]="opcion.ruta"
        routerLinkActive="lateral__enlace--activo"
        ariaCurrentWhenActive="page"
        (click)="menuMovil.set(false)"
      >
        {{ opcion.titulo }}
      </a>
    }
  </nav>
</aside>

@if (menuMovil()) {
  <div class="lateral__fondo" (click)="menuMovil.set(false)"></div>
}

<div class="marco">
  <header class="superior">
    <button
      type="button"
      class="btn btn-outline-secondary superior__menu px-2 py-1"
      aria-label="Abrir el menú"
      (click)="menuMovil.set(true)"
    >
      <i class="bi bi-list fs-4 d-block" aria-hidden="true"></i>
    </button>

    <h1 class="superior__titulo">{{ titulo() }}</h1>

    <div class="superior__usuario">
      <span class="text-body-secondary text-truncate d-none d-md-inline">{{
        usuario()?.correo
      }}</span>
      <span class="badge bg-primary-subtle text-primary-emphasis">{{ nombreRol() }}</span>
      <button type="button" class="btn btn-outline-secondary text-nowrap" (click)="cerrarSesion()">
        Cerrar sesión
      </button>
    </div>
  </header>

  <main class="marco__contenido">
    <app-sin-conexion />
    <router-outlet />
  </main>
</div>
