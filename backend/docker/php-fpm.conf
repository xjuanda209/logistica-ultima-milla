; php-fpm para 512 MB de RAM: pocos procesos y logs a stderr.
[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Pasa las variables de entorno de Render a PHP y envía lo que escriban los procesos al log.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
