; Ajustes de PHP para producción (se suman a php.ini-production).
expose_php = Off
memory_limit = 256M
session.upload_progress.enabled = 0

; Evidencias y fotos de incidencias: hasta 5 MB (max:5120 en los Form Requests).
upload_max_filesize = 6M
post_max_size = 8M

; Errores al log (stderr), nunca en la respuesta.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
