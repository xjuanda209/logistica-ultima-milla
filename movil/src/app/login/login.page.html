<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Logística de Última Milla</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>Iniciar sesión</h1>
  <p>Aplicación para repartidores</p>

  <form #formulario="ngForm" (ngSubmit)="entrar()">
    <ion-list>
      <ion-item>
        <ion-input
          name="correo"
          type="email"
          label="Correo"
          labelPlacement="stacked"
          autocomplete="username"
          required
          email
          [(ngModel)]="correo"
        ></ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          name="password"
          type="password"
          label="Contraseña"
          labelPlacement="stacked"
          autocomplete="current-password"
          required
          [(ngModel)]="password"
        ></ion-input>
      </ion-item>
    </ion-list>

    @if (error(); as mensaje) {
    <ion-text color="danger">
      <p role="alert">{{ mensaje }}</p>
    </ion-text>
    }

    <ion-button type="submit" expand="block" class="ion-margin-top" [disabled]="formulario.invalid || enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </ion-button>
  </form>
</ion-content>
